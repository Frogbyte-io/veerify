services:
  db:
    container_name: veerify-db
    image: postgres:17.5
    restart: always
    environment:
      POSTGRES_USER: veerify
      POSTGRES_PASSWORD: veerifypassword
      POSTGRES_DB: veerifydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: